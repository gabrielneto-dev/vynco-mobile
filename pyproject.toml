[project]
name = "agente-conteudo-iphones"
version = "0.1.0"
description = "Agente de conteúdo para loja de iPhones (OpenRouter + Nano Banana)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agente = "agente.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agente"]

[tool.setuptools.package-data]
agente = ["fontes/*.ttf"]  # Inter (OFL), usada pela arte final

[tool.pytest.ini_options]
testpaths = ["tests"]
